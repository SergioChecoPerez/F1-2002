<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F1 Ultra 3D Grand Prix</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body { background-color: #030407; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 5; }
        .header { text-align: center; }
        .title { color: #ff0033; font-size: 26px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 0 15px rgba(255, 0, 51, 0.8); }
        .score-board { font-size: 22px; font-weight: 800; color: #00ffcc; margin-top: 5px; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        .driver-info { font-size: 16px; font-weight: 700; color: #ffcc00; margin-top: 3px; text-transform: uppercase; }
        .controls { pointer-events: auto; display: flex; gap: 20px; width: 100%; max-width: 400px; height: 80px; margin: 0 auto 10px auto; }
        .btn-control { flex: 1; background: rgba(255, 0, 51, 0.25); border: 2px solid #ff0033; border-radius: 20px; color: white; font-size: 32px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); box-shadow: 0 0 20px rgba(255, 0, 51, 0.3); transition: all 0.1s; }
        .btn-control:active { background: rgba(255, 0, 51, 0.6); transform: scale(0.95); }
        
        .screen-overlay { pointer-events: auto; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 4, 7, 0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(12px); z-index: 10; }
        .main-title { color: #ff0033; font-size: 40px; font-weight: 900; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 30px rgba(255, 0, 51, 0.8); text-align: center; }
        .menu-buttons { display: flex; flex-direction: column; gap: 15px; width: 85%; max-width: 320px; }
        .menu-btn { padding: 16px; background: linear-gradient(135deg, #ff0033 0%, #99001f 100%); color: white; font-weight: 900; font-size: 18px; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 0 25px rgba(255, 0, 51, 0.6); text-transform: uppercase; letter-spacing: 2px; transition: transform 0.2s, box-shadow 0.2s; text-align: center; }
        .menu-btn:active { transform: scale(0.95); }
        
        .drivers-list { display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 360px; max-height: 65vh; overflow-y: auto; padding: 10px; }
        .driver-btn { padding: 14px; background: rgba(20, 25, 35, 0.9); border: 2px solid #333; border-radius: 15px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
        .driver-btn:hover, .driver-btn:active { border-color: #ff0033; background: rgba(40, 45, 60, 0.9); transform: scale(0.98); }
        .team-tag { font-size: 12px; padding: 4px 8px; border-radius: 8px; text-transform: uppercase; font-weight: 900; }
        
        .authors-box { background: rgba(15, 20, 30, 0.95); border: 2px solid #ff0033; border-radius: 20px; padding: 25px; width: 85%; max-width: 380px; text-align: center; }
        .authors-box h2 { color: #ff0033; font-size: 24px; margin-bottom: 15px; text-transform: uppercase; }
        .authors-box p { font-size: 15px; color: #ddd; margin-bottom: 10px; line-height: 1.4; }
        .back-btn { margin-top: 15px; padding: 12px 30px; background: #222; color: white; font-weight: bold; font-size: 15px; border: 1px solid #444; border-radius: 25px; cursor: pointer; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<div class="ui-layer" id="game-ui" style="display: none;">
    <div class="header">
        <div class="title">F1 Grand Prix</div>
        <div class="driver-info" id="driver-display">Пилот: -</div>
        <div class="score-board" id="score">ОЧКИ: 0</div>
    </div>
    <div class="controls">
        <button class="btn-control" id="btn-left">◄</button>
        <button class="btn-control" id="btn-right">►</button>
    </div>
</div>

<!-- Главное меню -->
<div class="screen-overlay" id="main-menu">
    <h1 class="main-title">F1 ULTRA 3D</h1>
    <div class="menu-buttons">
        <button class="menu-btn" onclick="openModes()">РЕЖИМЫ</button>
        <button class="menu-btn" style="background: linear-gradient(135deg, #444 0%, #111 100%);" onclick="showAuthors()">АВТОРЫ</button>
    </div>
</div>

<!-- Меню выбора режимов -->
<div class="screen-overlay" id="modes-menu" style="display: none;">
    <h1 class="main-title">ВЫБОР РЕЖИМА</h1>
    <div class="menu-buttons">
        <button class="menu-btn" onclick="openDriverSelect()">GRAND PRIX</button>
        <button class="menu-btn" style="background: #222;" onclick="showMenu()">НАЗАД</button>
    </div>
</div>

<!-- Выбор реальных пилотов F1 -->
<div class="screen-overlay" id="driver-select-menu" style="display: none;">
    <h1 class="main-title" style="font-size: 28px;">ВЫБЕРИТЕ ПИЛОТА</h1>
    <div class="drivers-list" id="drivers-container"></div>
    <button class="back-btn" onclick="openModes()">НАЗАД</button>
</div>

<!-- Авторы -->
<div class="screen-overlay" id="authors-screen" style="display: none;">
    <div class="authors-box">
        <h2>АВТОРЫ</h2>
        <p><strong>Разработка:</strong><br>ИИ-Разработчик & Пользователь</p>
        <p><strong>Режим:</strong><br>Grand Prix F1 с реальными пилотами</p>
        <button class="back-btn" onclick="showMenu()">НАЗАД</button>
    </div>
</div>

<!-- Game Over -->
<div class="screen-overlay" id="game-over-screen" style="display: none;">
    <h1 class="main-title" style="color: #ff0033;">АВАРИЯ!</h1>
    <p id="game-over-text" style="font-size: 20px; color: #ccc; margin-bottom: 25px;">Вы набрали: 0 очков</p>
    <div class="menu-buttons">
        <button class="menu-btn" onclick="startRace(selectedDriver)">ИГРАТЬ СНОВА</button>
        <button class="menu-btn" style="background: #222;" onclick="showMenu()">В МЕНЮ</button>
    </div>
</div>

<script>
    // Список реальных пилотов F1
    const DRIVERS = [
        { name: "Max Verstappen", team: "Red Bull", color: 0x0600ef, teamBg: "#0600ef" },
        { name: "Charles Leclerc", team: "Ferrari", color: 0xe10600, teamBg: "#e10600" },
        { name: "Lewis Hamilton", team: "Ferrari", color: 0xcc0000, teamBg: "#cc0000" },
        { name: "Lando Norris", team: "McLaren", color: 0xff8000, teamBg: "#ff8000" },
        { name: "Fernando Alonso", team: "Aston Martin", color: 0x00593f, teamBg: "#00593f" }
    ];

    let selectedDriver = DRIVERS[0];
    let scene, camera, renderer, playerCar;
    let enemies = [], roadLines = [];
    let score = 0, gameActive = false;
    const ROAD_WIDTH = 12, ROAD_BOUND = 4.3;
    let moveLeft = false, moveRight = false;

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05070c);
        scene.fog = new THREE.FogExp2(0x05070c, 0.012);

        camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.8, 8.5);
        camera.lookAt(0, 0.8, -5);

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(20, 40, 20);
        mainLight.castShadow = true;
        scene.add(mainLight);

        createTrack();
        renderDriversList();
        window.addEventListener('resize', onWindowResize);
    }

    function renderDriversList() {
        const container = document.getElementById('drivers-container');
        container.innerHTML = '';
        DRIVERS.forEach(driver => {
            const btn = document.createElement('div');
            btn.className = 'driver-btn';
            btn.innerHTML = `
                <span>${driver.name}</span>
                <span class="team-tag" style="background: ${driver.teamBg};">${driver.team}</span>
            `;
            btn.onclick = () => startRace(driver);
            container.appendChild(btn);
        });
    }

    function createTrack() {
        const grass = new THREE.Mesh(new THREE.PlaneGeometry(250, 500), new THREE.MeshStandardMaterial({ color: 0x0a1a0a, roughness: 0.9 }));
        grass.rotation.x = -Math.PI / 2; grass.position.z = -150; grass.receiveShadow = true;
        scene.add(grass);

        const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, 500), new THREE.MeshStandardMaterial({ color: 0x181a1f, roughness: 0.4 }));
        road.rotation.x = -Math.PI / 2; road.position.set(0, 0.01, -150); road.receiveShadow = true;
        scene.add(road);

        const dashGeo = new THREE.PlaneGeometry(0.25, 4);
        const dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for(let z = 20; z > -350; z -= 10) {
            const dash = new THREE.Mesh(dashGeo, dashMat);
            dash.rotation.x = -Math.PI / 2;
            dash.position.set(0, 0.03, z);
            scene.add(dash);
            roadLines.push(dash);
        }
    }

    function createUltraF1Car(colorHex) {
        const car = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.2, metalness: 0.5 });
        const carbonMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });
        const tireMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });

        const chassis = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.35, 2.2), bodyMat);
        chassis.position.set(0, 0.35, -0.2);
        car.add(chassis);

        const nose = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1.8, 5), bodyMat);
        nose.rotation.x = Math.PI / 2; nose.position.set(0, 0.32, -2.0); nose.scale.set(1, 1, 0.5);
        car.add(nose);

        const fWing = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.04, 0.45), carbonMat);
        fWing.position.set(0, 0.12, -2.7);
        car.add(fWing);

        const rWing = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, 0.4), bodyMat);
        rWing.position.set(0, 0.95, 1.25);
        car.add(rWing);

        const wheelGeo = new THREE.CylinderGeometry(0.33, 0.33, 0.45, 24);
        [[-1.05, 0.33, -1.6], [1.05, 0.33, -1.6], [-1.1, 0.36, 0.9], [1.1, 0.36, 0.9]].forEach(pos => {
            const tire = new THREE.Mesh(wheelGeo, tireMat);
            tire.rotation.z = Math.PI / 2;
            tire.position.set(...pos);
            car.add(tire);
        });

        return car;
    }

    function spawnEnemy() {
        const colors = [0xcccccc, 0xff0055, 0x00ffff, 0xffff00];
        const enemy = createUltraF1Car(colors[Math.floor(Math.random() * colors.length)]);
        enemy.position.set((Math.random() - 0.5) * (ROAD_WIDTH - 3.2), 0, -140);
        enemy.speed = 0.45 + Math.random() * 0.35;
        scene.add(enemy);
        enemies.push(enemy);
    }

    function startRace(driver) {
        selectedDriver = driver;
        score = 0;
        document.getElementById('score').innerText = "ОЧКИ: 0";
        document.getElementById('driver-display').innerText = `Пилот: ${driver.name} (${driver.team})`;
        
        if (playerCar) scene.remove(playerCar);
        enemies.forEach(e => scene.remove(e));
        enemies = [];

        playerCar = createUltraF1Car(driver.color);
        playerCar.position.set(0, 0, 0);
        scene.add(playerCar);

        hideAllOverlays();
        document.getElementById('game-ui').style.display = 'flex';
        gameActive = true;
    }

    function update() {
        if (!gameActive) {
            roadLines.forEach(dash => {
                dash.position.z += 0.25;
                if (dash.position.z > 20) dash.position.z -= 370;
            });
            return;
        }

        if (moveLeft && playerCar.position.x > -ROAD_BOUND) playerCar.position.x -= 0.16;
        if (moveRight && playerCar.position.x < ROAD_BOUND) playerCar.position.x += 0.16;

        roadLines.forEach(dash => {
            dash.position.z += 1.0;
            if (dash.position.z > 20) dash.position.z -= 370;
        });

        if (Math.random() < 0.025) spawnEnemy();

        for (let i = enemies.length - 1; i >= 0; i--) {
            let enemy = enemies[i];
            enemy.position.z += enemy.speed + (score / 600);

            const dx = playerCar.position.x - enemy.position.x;
            const dz = playerCar.position.z - enemy.position.z;

            if (Math.sqrt(dx * dx + dz * dz) < 2.0 && Math.abs(dx) < 1.3) endGame();

            if (enemy.position.z > 15) {
                scene.remove(enemy);
                enemies.splice(i, 1);
                score += 10;
                document.getElementById('score').innerText = "ОЧКИ: " + score;
            }
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        update();
        renderer.render(scene, camera);
    }

    function hideAllOverlays() {
        document.querySelectorAll('.screen-overlay').forEach(el => el.style.display = 'none');
    }

    function showMenu() {
        gameActive = false;
        hideAllOverlays();
        document.getElementById('game-ui').style.display = 'none';
        document.getElementById('main-menu').style.display = 'flex';
    }

    function openModes() {
        hideAllOverlays();
        document.getElementById('modes-menu').style.display = 'flex';
    }

    function openDriverSelect() {
        hideAllOverlays();
        document.getElementById('driver-select-menu').style.display = 'flex';
    }

    function showAuthors() {
        hideAllOverlays();
        document.getElementById('authors-screen').style.display = 'flex';
    }

    function endGame() {
        gameActive = false;
        document.getElementById('game-ui').style.display = 'none';
        document.getElementById('game-over-text').innerText = `${selectedDriver.name}, вы набрали ${score} очков`;
        document.getElementById('game-over-screen').style.display = 'flex';
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
        if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
        if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
    });

    const addTouch = (elemId, action) => {
        const el = document.getElementById(elemId);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); action(true); });
        el.addEventListener('touchend', (e) => { e.preventDefault(); action(false); });
        el.addEventListener('mousedown', () => action(true));
        el.addEventListener('mouseup', () => action(false));
    };

    addTouch('btn-left', val => moveLeft = val);
    addTouch('btn-right', val => moveRight = val);

    init3D();
    animate();
</script>

</body>
</html>
