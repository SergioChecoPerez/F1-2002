<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F1 2002 Ultra Cockpit & Physics</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body { background-color: #030407; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 5; }
        .header { text-align: center; }
        .title { color: #ff0033; font-size: 24px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 0 15px rgba(255, 0, 51, 0.8); }
        .score-board { font-size: 20px; font-weight: 800; color: #00ffcc; margin-top: 4px; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        .driver-info { font-size: 15px; font-weight: 700; color: #ffcc00; margin-top: 2px; text-transform: uppercase; }
        
        .cam-btn { pointer-events: auto; position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6); border: 2px solid #00ffcc; color: #00ffcc; padding: 8px 16px; border-radius: 20px; font-weight: 800; cursor: pointer; backdrop-filter: blur(5px); }
        .cam-btn:active { transform: scale(0.95); }

        .controls { pointer-events: auto; display: flex; gap: 20px; width: 100%; max-width: 400px; height: 80px; margin: 0 auto 10px auto; }
        .btn-control { flex: 1; background: rgba(255, 0, 51, 0.25); border: 2px solid #ff0033; border-radius: 20px; color: white; font-size: 32px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); box-shadow: 0 0 20px rgba(255, 0, 51, 0.3); transition: all 0.1s; }
        .btn-control:active { background: rgba(255, 0, 51, 0.6); transform: scale(0.95); }
        
        .screen-overlay { pointer-events: auto; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 4, 7, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(12px); z-index: 10; }
        .main-title { color: #ff0033; font-size: 36px; font-weight: 900; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 30px rgba(255, 0, 51, 0.8); text-align: center; }
        .menu-buttons { display: flex; flex-direction: column; gap: 15px; width: 85%; max-width: 320px; }
        .menu-btn { padding: 16px; background: linear-gradient(135deg, #ff0033 0%, #99001f 100%); color: white; font-weight: 900; font-size: 18px; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 0 25px rgba(255, 0, 51, 0.6); text-transform: uppercase; letter-spacing: 2px; transition: transform 0.2s; text-align: center; }
        .menu-btn:active { transform: scale(0.95); }
        
        .drivers-list { display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 380px; max-height: 65vh; overflow-y: auto; padding: 10px; }
        .driver-btn { padding: 14px; background: rgba(20, 25, 35, 0.9); border: 2px solid #333; border-radius: 15px; color: white; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
        .driver-btn:hover, .driver-btn:active { border-color: #ff0033; background: rgba(40, 45, 60, 0.9); transform: scale(0.98); }
        .team-tag { font-size: 11px; padding: 4px 8px; border-radius: 8px; text-transform: uppercase; font-weight: 900; }
        
        .authors-box { background: rgba(15, 20, 30, 0.95); border: 2px solid #ff0033; border-radius: 20px; padding: 25px; width: 85%; max-width: 380px; text-align: center; }
        .authors-box h2 { color: #ff0033; font-size: 24px; margin-bottom: 15px; text-transform: uppercase; }
        .authors-box p { font-size: 15px; color: #ddd; margin-bottom: 10px; line-height: 1.4; }
        .back-btn { margin-top: 15px; padding: 12px 30px; background: #222; color: white; font-weight: bold; font-size: 15px; border: 1px solid #444; border-radius: 25px; cursor: pointer; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<div class="ui-layer" id="game-ui" style="display: none;">
    <button class="cam-btn" onclick="toggleCamera()">🎥 КАМЕРА: <span id="cam-name">3D</span></button>
    <div class="header">
        <div class="title">F1 GRAND PRIX</div>
        <div class="driver-info" id="driver-display">Пилот: -</div>
        <div class="score-board" id="score">ОЧКИ: 0</div>
    </div>
    <div class="controls">
        <button class="btn-control" id="btn-left">◄</button>
        <button class="btn-control" id="btn-right">►</button>
    </div>
</div>

<div class="screen-overlay" id="main-menu">
    <h1 class="main-title">F1 ULTRA 3D</h1>
    <div class="menu-buttons">
        <button class="menu-btn" onclick="openModes()">РЕЖИМЫ</button>
        <button class="menu-btn" style="background: linear-gradient(135deg, #444 0%, #111 100%);" onclick="showAuthors()">АВТОРЫ</button>
    </div>
</div>

<div class="screen-overlay" id="modes-menu" style="display: none;">
    <h1 class="main-title">ВЫБОР СЕЗОНА</h1>
    <div class="menu-buttons">
        <button class="menu-btn" style="background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);" onclick="openDriverSelect('2002')">🏆 ЛЕГЕНДЫ 2002</button>
        <button class="menu-btn" onclick="openDriverSelect('modern')">🏎️ СОВРЕМЕННЫЕ</button>
        <button class="menu-btn" style="background: #222;" onclick="showMenu()">НАЗАД</button>
    </div>
</div>

<div class="screen-overlay" id="driver-select-menu" style="display: none;">
    <h1 class="main-title" id="driver-select-title" style="font-size: 26px;">ВЫБЕРИТЕ ПИЛОТА</h1>
    <div class="drivers-list" id="drivers-container"></div>
    <button class="back-btn" onclick="openModes()">НАЗАД</button>
</div>

<div class="screen-overlay" id="authors-screen" style="display: none;">
    <div class="authors-box">
        <h2>АВТОРЫ</h2>
        <p><strong>Разработка:</strong><br>ИИ-Разработчик & Пользователь</p>
        <p><strong>Обновление:</strong><br>Вид от 1-го лица, анимированный руль F1 и гипер-детализация болидов!</p>
        <button class="back-btn" onclick="showMenu()">НАЗАД</button>
    </div>
</div>

<div class="screen-overlay" id="game-over-screen" style="display: none;">
    <h1 class="main-title" style="color: #ff0033;">АВАРИЯ!</h1>
    <p id="game-over-text" style="font-size: 20px; color: #ccc; margin-bottom: 25px;">Вы набрали: 0 очков</p>
    <div class="menu-buttons">
        <button class="menu-btn" onclick="startRace(selectedDriver)">ИГРАТЬ СНОВА</button>
        <button class="menu-btn" style="background: #222;" onclick="showMenu()">В МЕНЮ</button>
    </div>
</div>

<script>
    const DRIVERS_2002 = [
        { name: "#1 Michael Schumacher", team: "Ferrari 2002", color: 0xc90000, stripeColor: 0xffffff, num: "1", teamBg: "#c90000" },
        { name: "#3 Juan Pablo Montoya", team: "Williams BMW", color: 0x051b47, stripeColor: 0xffffff, num: "3", teamBg: "#051b47" },
        { name: "#4 David Coulthard", team: "McLaren Mercedes", color: 0x111111, stripeColor: 0xe6e6e6, num: "4", teamBg: "#222222" },
        { name: "#14 Kimi Räikkönen", team: "McLaren Mercedes", color: 0x222222, stripeColor: 0xff0000, num: "14", teamBg: "#333333" },
        { name: "#21 Fernando Alonso", team: "Renault 2002", color: 0x0099ff, stripeColor: 0xffd700, num: "21", teamBg: "#0088cc" }
    ];

    const DRIVERS_MODERN = [
        { name: "Max Verstappen", team: "Red Bull", color: 0x0600ef, stripeColor: 0xff0000, num: "1", teamBg: "#0600ef" },
        { name: "Charles Leclerc", team: "Ferrari", color: 0xe10600, stripeColor: 0xffffff, num: "16", teamBg: "#e10600" },
        { name: "Lando Norris", team: "McLaren", color: 0xff8000, stripeColor: 0x111111, num: "4", teamBg: "#ff8000" }
    ];

    let currentEra = '2002';
    let selectedDriver = DRIVERS_2002[0];
    let scene, camera, renderer, playerCar, steeringWheelMesh;
    let enemies = [], roadLines = [];
    let score = 0, gameActive = false;
    const ROAD_WIDTH = 12, ROAD_BOUND = 4.3;
    let moveLeft = false, moveRight = false;
    
    // Режимы камеры: 0 = Сзади, 1 = Кокпит (От 1-го лица)
    let cameraMode = 0; 
    let currentSteerAngle = 0;

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05070c);
        scene.fog = new THREE.FogExp2(0x05070c, 0.012);

        camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.4);
        mainLight.position.set(20, 40, 20);
        mainLight.castShadow = true;
        scene.add(mainLight);

        createTrack();
        window.addEventListener('resize', onWindowResize);
    }

    function toggleCamera() {
        cameraMode = cameraMode === 0 ? 1 : 0;
        document.getElementById('cam-name').innerText = cameraMode === 0 ? '3D' : 'КОКПИТ';
    }

    function renderDriversList(era) {
        currentEra = era;
        const container = document.getElementById('drivers-container');
        const title = document.getElementById('driver-select-title');
        container.innerHTML = '';
        
        const drivers = era === '2002' ? DRIVERS_2002 : DRIVERS_MODERN;
        title.innerText = era === '2002' ? 'СЕЗОН 2002 (ЛЕГЕНДЫ)' : 'СОВРЕМЕННЫЕ ПИЛОТЫ';

        drivers.forEach(driver => {
            const btn = document.createElement('div');
            btn.className = 'driver-btn';
            btn.innerHTML = `
                <span>${driver.name}</span>
                <span class="team-tag" style="background: ${driver.teamBg};">${driver.team}</span>
            `;
            btn.onclick = () => startRace(driver);
            container.appendChild(btn);
        });
    }

    function createTrack() {
        const grass = new THREE.Mesh(new THREE.PlaneGeometry(250, 500), new THREE.MeshStandardMaterial({ color: 0x0a1a0a, roughness: 0.9 }));
        grass.rotation.x = -Math.PI / 2; grass.position.z = -150; grass.receiveShadow = true;
        scene.add(grass);

        const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, 500), new THREE.MeshStandardMaterial({ color: 0x181a1f, roughness: 0.4 }));
        road.rotation.x = -Math.PI / 2; road.position.set(0, 0.01, -150); road.receiveShadow = true;
        scene.add(road);

        const dashGeo = new THREE.PlaneGeometry(0.25, 4);
        const dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for(let z = 20; z > -350; z -= 10) {
            const dash = new THREE.Mesh(dashGeo, dashMat);
            dash.rotation.x = -Math.PI / 2;
            dash.position.set(0, 0.03, z);
            scene.add(dash);
            roadLines.push(dash);
        }
    }

    // Создание продвинутой модели F1 с РУЛЕМ
    function createDetailedF1Car(mainColorHex, stripeColorHex, isPlayer = false) {
        const car = new THREE.Group();
        
        const bodyMat = new THREE.MeshStandardMaterial({ color: mainColorHex, roughness: 0.15, metalness: 0.5 });
        const stripeMat = new THREE.MeshStandardMaterial({ color: stripeColorHex, roughness: 0.2, metalness: 0.3 });
        const carbonMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const tireMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
        const rimMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.1 });

        // 1. Монокок и понтоны (Sidepods)
        const chassis = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.35, 2.3), bodyMat);
        chassis.position.set(0, 0.35, -0.2);
        car.add(chassis);

        const sidepodL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.3, 1.2), bodyMat);
        sidepodL.position.set(-0.5, 0.32, -0.1);
        car.add(sidepodL);
        const sidepodR = sidepodL.clone();
        sidepodR.position.x = 0.5;
        car.add(sidepodR);

        // Полоса ливреи
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.37, 2.32), stripeMat);
        stripe.position.set(0, 0.36, -0.2);
        car.add(stripe);

        // Верхний воздухозаборник (Airbox)
        const airbox = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.28, 0.5), bodyMat);
        airbox.position.set(0, 0.62, 0.2);
        car.add(airbox);

        // 2. Длинный носовой обтекатель
        const nose = new THREE.Mesh(new THREE.ConeGeometry(0.32, 1.9, 5), bodyMat);
        nose.rotation.x = Math.PI / 2; nose.position.set(0, 0.32, -2.1); nose.scale.set(1, 1, 0.45);
        car.add(nose);

        // 3. Многослойное переднее крыло
        const fWingMain = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.04, 0.45), carbonMat);
        fWingMain.position.set(0, 0.12, -2.8);
        car.add(fWingMain);

        const fWingEndL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.3, 0.55), stripeMat);
        fWingEndL.position.set(-1.1, 0.22, -2.8);
        car.add(fWingEndL);
        const fWingEndR = fWingEndL.clone();
        fWingEndR.position.x = 1.1;
        car.add(fWingEndR);

        // 4. Заднее антикрыло F1
        const rWing = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, 0.4), bodyMat);
        rWing.position.set(0, 0.95, 1.3);
        car.add(rWing);

        const rWingFlap = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.04, 0.2), stripeMat);
        rWingFlap.position.set(0, 1.03, 1.3);
        car.add(rWingFlap);

        // 5. Кокпит и РУЛЬ F1 (только для игрока)
        const cockpit = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.22, 0.8), carbonMat);
        cockpit.position.set(0, 0.5, -0.1);
        car.add(cockpit);

        if (isPlayer) {
            // Анимированный штурвал F1
            const steeringGroup = new THREE.Group();
            const wheelBase = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.18, 0.04), carbonMat);
            const wheelScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.06), new THREE.MeshBasicMaterial({ color: 0x00ffcc }));
            wheelScreen.position.set(0, 0.02, -0.025);
            wheelScreen.rotation.y = Math.PI;
            
            const handleL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.16, 0.05), stripeMat);
            handleL.position.set(-0.17, 0, 0);
            const handleR = handleL.clone();
            handleR.position.x = 0.17;

            steeringGroup.add(wheelBase, wheelScreen, handleL, handleR);
            steeringGroup.position.set(0, 0.52, -0.32);
            car.add(steeringGroup);
            steeringWheelMesh = steeringGroup; // Запоминаем ссылку для анимации
        } else {
            const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 16), stripeMat);
            helmet.position.set(0, 0.65, -0.1);
            car.add(helmet);
        }

        // 6. Колёса с детализированными суппортами
        const wheelGeo = new THREE.CylinderGeometry(0.34, 0.34, 0.48, 24);
        const rimGeo = new THREE.CylinderGeometry(0.21, 0.21, 0.49, 12);
        
        [[-1.08, 0.34, -1.6], [1.08, 0.34, -1.6], [-1.12, 0.37, 1.0], [1.12, 0.37, 1.0]].forEach(pos => {
            const tire = new THREE.Mesh(wheelGeo, tireMat);
            tire.rotation.z = Math.PI / 2;
            tire.position.set(...pos);
            car.add(tire);

            const rim = new THREE.Mesh(rimGeo, rimMat);
            rim.rotation.z = Math.PI / 2;
            rim.position.set(...pos);
            car.add(rim);
        });

        return car;
    }

    function spawnEnemy() {
        const pool = currentEra === '2002' ? DRIVERS_2002 : DRIVERS_MODERN;
        const enemyData = pool[Math.floor(Math.random() * pool.length)];
        const enemy = createDetailedF1Car(enemyData.color, enemyData.stripeColor, false);
        enemy.position.set((Math.random() - 0.5) * (ROAD_WIDTH - 3.2), 0, -140);
        enemy.speed = 0.45 + Math.random() * 0.35;
        scene.add(enemy);
        enemies.push(enemy);
    }

    function startRace(driver) {
        selectedDriver = driver;
        score = 0;
        document.getElementById('score').innerText = "ОЧКИ: 0";
        document.getElementById('driver-display').innerText = `Пилот: ${driver.name}`;
        
        if (playerCar) scene.remove(playerCar);
        enemies.forEach(e => scene.remove(e));
        enemies = [];

        playerCar = createDetailedF1Car(driver.color, driver.stripeColor, true);
        playerCar.position.set(0, 0, 0);
        scene.add(playerCar);

        hideAllOverlays();
        document.getElementById('game-ui').style.display = 'flex';
        gameActive = true;
    }

    function update() {
        if (!gameActive) {
            roadLines.forEach(dash => {
                dash.position.z += 0.25;
                if (dash.position.z > 20) dash.position.z -= 370;
            });
            return;
        }

        // Рулевое управление и вращение руля
        let targetSteer = 0;
        if (moveLeft && playerCar.position.x > -ROAD_BOUND) {
            playerCar.position.x -= 0.16;
            targetSteer = 0.6; // Поворот руля влево
        }
        if (moveRight && playerCar.position.x < ROAD_BOUND) {
            playerCar.position.x += 0.16;
            targetSteer = -0.6; // Поворот руля вправо
        }

        // Плавный поворот штурвала F1
        currentSteerAngle += (targetSteer - currentSteerAngle) * 0.25;
        if (steeringWheelMesh) {
            steeringWheelMesh.rotation.z = currentSteerAngle;
        }

        // Крена кузова при поворотах
        playerCar.rotation.z = currentSteerAngle * 0.08;

        // Обновление положения камеры
        if (cameraMode === 0) {
            // Камера 3D сзади
            camera.position.set(playerCar.position.x * 0.4, 3.8, 8.5);
            camera.lookAt(playerCar.position.x * 0.6, 0.8, -5);
        } else {
            // Вид от 1-го лица (из кокпита!)
            camera.position.set(playerCar.position.x, 0.65, -0.05);
            camera.lookAt(playerCar.position.x + currentSteerAngle * 0.5, 0.6, -10);
        }

        roadLines.forEach(dash => {
            dash.position.z += 1.0;
            if (dash.position.z > 20) dash.position.z -= 370;
        });

        if (Math.random() < 0.025) spawnEnemy();

        for (let i = enemies.length - 1; i >= 0; i--) {
            let enemy = enemies[i];
            enemy.position.z += enemy.speed + (score / 600);

            const dx = playerCar.position.x - enemy.position.x;
            const dz = playerCar.position.z - enemy.position.z;

            if (Math.sqrt(dx * dx + dz * dz) < 2.0 && Math.abs(dx) < 1.3) endGame();

            if (enemy.position.z > 15) {
                scene.remove(enemy);
                enemies.splice(i, 1);
                score += 10;
                document.getElementById('score').innerText = "ОЧКИ: " + score;
            }
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        update();
        renderer.render(scene, camera);
    }

    function hideAllOverlays() {
        document.querySelectorAll('.screen-overlay').forEach(el => el.style.display = 'none');
    }

    function showMenu() {
        gameActive = false;
        hideAllOverlays();
        document.getElementById('game-ui').style.display = 'none';
        document.getElementById('main-menu').style.display = 'flex';
    }

    function openModes() {
        hideAllOverlays();
        document.getElementById('modes-menu').style.display = 'flex';
    }

    function openDriverSelect(era) {
        hideAllOverlays();
        renderDriversList(era);
        document.getElementById('driver-select-menu').style.display = 'flex';
    }

    function showAuthors() {
        hideAllOverlays();
        document.getElementById('authors-screen').style.display = 'flex';
    }

    function endGame() {
        gameActive = false;
        document.getElementById('game-ui').style.display = 'none';
        document.getElementById('game-over-text').innerText = `${selectedDriver.name}, вы набрали ${score} очков`;
        document.getElementById('game-over-screen').style.display = 'flex';
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
        if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
        if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
    });

    const addTouch = (elemId, action) => {
        const el = document.getElementById(elemId);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); action(true); });
        el.addEventListener('touchend', (e) => { e.preventDefault(); action(false); });
        el.addEventListener('mousedown', () => action(true));
        el.addEventListener('mouseup', () => action(false));
    };

    addTouch('btn-left', val => moveLeft = val);
    addTouch('btn-right', val => moveRight = val);

    init3D();
    animate();
</script>

</body>
</html>
